apiVersion: v1
kind: Namespace
metadata: {name: rag}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: rag-data, namespace: rag}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: gp2
  resources: {requests: {storage: 5Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: rag-api, namespace: rag, labels: {app: rag-api}}
spec:
  # Single replica: the embedded vector store lives on one RWO volume.
  # Scale out only after moving vectors to a shared store (pgvector on RDS).
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: rag-api}}
  template:
    metadata: {labels: {app: rag-api}}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: rag-api
          image: IMAGE_PLACEHOLDER
          ports: [{containerPort: 8000}]
          env:
            - name: ANTHROPIC_API_KEY
              valueFrom: {secretKeyRef: {name: rag-secrets, key: anthropic-api-key}}
            - name: API_TOKEN
              valueFrom: {secretKeyRef: {name: rag-secrets, key: api-token}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 250m, memory: 1Gi}
            limits: {memory: 2Gi}
          startupProbe: {httpGet: {path: /healthz, port: 8000}, periodSeconds: 5, failureThreshold: 30}
          readinessProbe: {httpGet: {path: /readyz, port: 8000}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /healthz, port: 8000}, periodSeconds: 20}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: rag-data}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: rag-api
  namespace: rag
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
spec:
  type: LoadBalancer
  selector: {app: rag-api}
  ports: [{port: 80, targetPort: 8000}]
