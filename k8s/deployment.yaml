apiVersion: apps/v1
kind: Deployment
metadata: {name: rag-api, labels: {app: rag-api}}
spec:
  replicas: 2
  selector: {matchLabels: {app: rag-api}}
  template:
    metadata: {labels: {app: rag-api}}
    spec:
      containers:
        - name: rag-api
          image: IMAGE_PLACEHOLDER
          ports: [{containerPort: 8000}]
          env:
            - name: ANTHROPIC_API_KEY
              valueFrom: {secretKeyRef: {name: llm-secrets, key: anthropic-api-key}}
          resources:
            requests: {cpu: 250m, memory: 1Gi}
            limits: {cpu: "1", memory: 2Gi}
          readinessProbe: {httpGet: {path: /healthz, port: 8000}, initialDelaySeconds: 20}
          livenessProbe: {httpGet: {path: /healthz, port: 8000}, initialDelaySeconds: 40}
          volumeMounts: [{name: data, mountPath: /data}]
      volumes: [{name: data, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata: {name: rag-api}
spec:
  type: LoadBalancer
  selector: {app: rag-api}
  ports: [{port: 80, targetPort: 8000}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: rag-api}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: rag-api}
  minReplicas: 2
  maxReplicas: 5
  metrics: [{type: Resource, resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}}]
