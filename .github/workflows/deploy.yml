name: build-test-deploy
on:
  push: {branches: [main]}
permissions: {id-token: write, contents: read}
env: {AWS_REGION: us-east-1, CLUSTER: rag-on-aws, REPO: rag-on-aws}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pytest && pytest -q tests
  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push
        run: |
          IMAGE=${{ steps.ecr.outputs.registry }}/$REPO:${{ github.sha }}
          docker build -t $IMAGE . && docker push $IMAGE
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV
      - name: Deploy to EKS
        run: |
          aws eks update-kubeconfig --name $CLUSTER --region $AWS_REGION
          sed "s|IMAGE_PLACEHOLDER|$IMAGE|" k8s/deployment.yaml | kubectl apply -f -
          kubectl rollout status deployment/rag-api --timeout=300s
